version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: nutrivida-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nutrivida_db
      MYSQL_USER: nutri_user
      MYSQL_PASSWORD: nutri_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nutrivida-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrivida-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/nutrivida_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=nutri_user
      - SPRING_DATASOURCE_PASSWORD=nutri_password
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - nutrivida-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutrivida-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nutrivida-network

volumes:
  mysql_data:

networks:
  nutrivida-network:
    driver: bridge