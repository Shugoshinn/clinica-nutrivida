server:
  port: ${SERVER_PORT:5001}

spring:
  application:
    name: nutrivida-admin-service

  # --- Validación del JWT emitido por Azure Entra ID (IDaaS) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/${app.security.tenant-id}/discovery/v2.0/keys

  # --- Clúster RabbitMQ a administrar (EC2 por defecto, docker-compose vía variables) ---
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:3.84.123.87:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:admin123}

  # --- Clúster Kafka a administrar ---
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    admin:
      properties:
        request.timeout.ms: 10000
        default.api.timeout.ms: 15000

app:
  security:
    tenant-id: ${AZURE_TENANT_ID:9188040d-6c67-4c5b-b112-36a304b66dad}
    client-id: ${AZURE_CLIENT_ID:db5f13af-8b1a-4d80-9944-17ea6ff024cf}
    issuers:
      - https://login.microsoftonline.com/${app.security.tenant-id}/v2.0
      - https://sts.windows.net/${app.security.tenant-id}/
    audiences:
      - api://${app.security.client-id}
      - ${app.security.client-id}
    default-role: Paciente
    role-mappings:
      "[nicolasxd08@gmail.com]": Administrador
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:4200,http://localhost:5173}
  kafka:
    # Tiempo máximo de espera de cada operación administrativa
    operation-timeout-ms: 15000
